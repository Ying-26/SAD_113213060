<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追星記事 | 偶像分享交流平台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入文青感字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9f8f6; /* 淡淡的文青奶油杏色 */
            color: #3a3530; /* 深煙燻茶色字體 */
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #e3ded8;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-stone-200 sticky top-0 z-50 px-4 py-3 shadow-xs">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="#" onclick="switchPage('squarePage')" class="text-xl font-medium tracking-widest text-stone-700 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-500/80"></i> 追星記事
            </a>
            <div id="navAuthButtons" class="flex gap-4 items-center text-sm">
                <!-- 根據登入狀態動態切換 -->
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:py-8">
        
        <!-- 1. 大家都在看的分享區 (大廣場) -->
        <section id="squarePage" class="page-view">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-medium text-stone-600 tracking-wider">星光交流廣場</h2>
                <button onclick="checkLoginAndGoPost()" class="bg-stone-700 hover:bg-stone-800 text-white text-sm px-4 py-2 rounded-full transition duration-300 flex items-center gap-1.5 shadow-xs">
                    <i class="fa-solid fa-pen"></i> 新增貼文
                </button>
            </div>
            <div id="squarePostList" class="space-y-6">
                <!-- 貼文動態渲染 -->
            </div>
        </section>

        <!-- 2. 註冊登入頁面 -->
        <section id="authPage" class="page-view hidden max-w-md mx-auto my-8 bg-white p-8 rounded-2xl border border-stone-100 shadow-sm">
            <div class="flex justify-center gap-6 mb-8 text-lg font-medium border-b border-stone-100 pb-3">
                <button id="tabLogin" onclick="toggleAuthTab('login')" class="text-stone-800 border-b-2 border-stone-800 pb-3 -mb-4 transition-all">登入</button>
                <button id="tabRegister" onclick="toggleAuthTab('register')" class="text-stone-400 pb-3 -mb-4 transition-all">註冊帳號</button>
            </div>

            <!-- 登入表單 -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">使用者 ID</label>
                    <input type="text" id="loginId" required class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50/50 focus:outline-none focus:border-stone-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">密碼</label>
                    <input type="password" id="loginPassword" required class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50/50 focus:outline-none focus:border-stone-600 transition">
                </div>
                <button type="submit" class="w-full bg-stone-700 hover:bg-stone-800 text-white py-2.5 rounded-lg text-sm font-medium transition mt-4">登入平台</button>
            </form>

            <!-- 註冊表單 -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div class="flex flex-col items-center mb-4">
                    <label class="block text-xs font-medium text-stone-500 mb-2">上傳大頭貼</label>
                    <div class="relative group cursor-pointer w-20 h-20 bg-stone-100 rounded-full flex items-center justify-center border-2 border-dashed border-stone-300 overflow-hidden" onclick="document.getElementById('regAvatar').click()">
                        <img id="avatarPreview" class="w-full h-full object-cover hidden">
                        <div id="avatarPlaceholder" class="text-stone-400 text-center flex flex-col items-center">
                            <i class="fa-solid fa-camera text-sm"></i>
                            <span class="text-[10px] mt-0.5">選擇照片</span>
                        </div>
                    </div>
                    <input type="file" id="regAvatar" accept="image/*" class="hidden" onchange="previewImage(this, 'avatarPreview', 'avatarPlaceholder')">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">使用者 ID (登入帳號)</label>
                    <input type="text" id="regId" required class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50/50 focus:outline-none focus:border-stone-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">暱稱 (顯示名稱)</label>
                    <input type="text" id="regName" required class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50/50 focus:outline-none focus:border-stone-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">密碼</label>
                    <input type="password" id="regPassword" required class="w-full border border-stone-200 rounded-lg p-2.5 text-sm bg-stone-50/50 focus:outline-none focus:border-stone-600 transition">
                </div>
                <button type="submit" class="w-full bg-stone-700 hover:bg-stone-800 text-white py-2.5 rounded-lg text-sm font-medium transition mt-4">完成註冊</button>
            </form>

            <!-- 雙重認證表單 (圖形驗證) -->
            <form id="twoFactorForm" onsubmit="handleTwoFactor(event)" class="space-y-4 hidden">
                <div class="text-center mb-4">
                    <div class="w-12 h-12 bg-stone-100 text-stone-700 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h3 class="text-sm font-medium text-stone-800">安全驗證</h3>
                    <p class="text-xs text-stone-600 mt-2 bg-stone-50 py-2.5 rounded-lg border border-stone-200 shadow-inner">請選取所有包含 <strong id="captchaTargetName" class="text-stone-900 text-base mx-1"></strong> 的圖片</p>
                </div>
                <!-- 3x3 圖片網格 -->
                <div id="captchaGrid" class="grid grid-cols-3 gap-1.5 p-1.5 bg-stone-100 rounded-xl">
                    <!-- 動態渲染圖片 -->
                </div>
                <div class="flex gap-2 mt-4">
                    <button type="button" onclick="cancelTwoFactor()" class="w-1/3 bg-stone-100 hover:bg-stone-200 text-stone-600 py-2.5 rounded-lg text-sm font-medium transition">取消</button>
                    <button type="submit" class="w-2/3 bg-stone-700 hover:bg-stone-800 text-white py-2.5 rounded-lg text-sm font-medium transition">驗證並登入</button>
                </div>
            </form>
        </section>

        <!-- 3. 個人首頁 -->
        <section id="profilePage" class="page-view hidden">
            <!-- 個人資訊欄 -->
            <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-xs flex flex-col sm:flex-row items-center gap-6 mb-8">
                <img id="profileUserAvatar" src="" class="w-20 h-20 rounded-full object-cover border-2 border-stone-100 shadow-inner">
                <div class="text-center sm:text-left flex-1">
                    <h2 id="profileUserName" class="text-xl font-medium text-stone-800"></h2>
                    <p id="profileUserId" class="text-xs text-stone-400 mt-0.5"></p>
                </div>
                <button id="createPostBtn" onclick="switchPage('createPostPage')" class="border border-stone-400 hover:bg-stone-50 text-stone-700 text-xs font-medium px-4 py-2 rounded-full transition">
                    <i class="fa-solid fa-plus mr-1"></i>撰寫新文章
                </button>
            </div>
            
            <h3 class="text-sm font-medium text-stone-500 tracking-wider mb-4"><i class="fa-solid fa-box-archive mr-1"></i> 我的追星筆記</h3>
            <div id="myPostList" class="space-y-6">
                <!-- 個人貼文動態渲染 -->
            </div>
        </section>

        <!-- 4. 新增貼文畫面 -->
        <section id="createPostPage" class="page-view hidden max-w-xl mx-auto bg-white p-6 rounded-2xl border border-stone-100 shadow-sm">
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-stone-100">
                <img id="currentPostAvatar" class="w-10 h-10 rounded-full object-cover">
                <div>
                    <div id="currentPostName" class="text-sm font-medium text-stone-700"></div>
                    <div id="currentPostId" class="text-xs text-stone-400"></div>
                </div>
            </div>

            <form onsubmit="handleCreatePost(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">發布主題</label>
                    <input type="text" id="postTitle" required placeholder="輸入偶像、舞台或是專輯主題..." class="w-full border border-stone-100 rounded-lg p-2.5 text-sm bg-stone-50/30 focus:outline-none focus:border-stone-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">發布內容</label>
                    <textarea id="postContent" required rows="6" placeholder="分享你對這次回歸的心得，或是安利偶像的話吧..." class="w-full border border-stone-100 rounded-lg p-2.5 text-sm bg-stone-50/30 focus:outline-none focus:border-stone-600 transition resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-500 mb-1">上傳相片 (自由選擇)</label>
                    <div class="mt-1 flex gap-4 items-center">
                        <button type="button" onclick="document.getElementById('postImageInput').click()" class="bg-stone-100 hover:bg-stone-200/70 text-stone-600 text-xs px-3 py-2 rounded-md transition flex items-center gap-1">
                            <i class="fa-solid fa-image"></i> 選擇檔案
                        </button>
                        <span id="postImageName" class="text-xs text-stone-400 truncate max-w-[200px]">未選擇任何檔案</span>
                    </div>
                    <input type="file" id="postImageInput" accept="image/*" class="hidden" onchange="handlePostImageSelect(this)">
                    <div id="postImgPreviewWrapper" class="mt-3 hidden relative w-full max-h-48 overflow-hidden rounded-lg">
                        <img id="postImagePreview" class="w-full h-full object-cover">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-stone-100">
                    <button type="button" onclick="switchPage('squarePage')" class="text-stone-400 hover:text-stone-600 text-xs px-4 py-2 transition">取消</button>
                    <button type="submit" class="bg-stone-700 hover:bg-stone-800 text-white text-xs px-5 py-2 rounded-full transition shadow-xs">確認發布</button>
                </div>
            </form>
        </section>

    </main>

    <!-- 底部提示框 (未登入點擊留言時彈出) -->
    <div id="loginPromptModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-lg mx-4">
            <div class="w-12 h-12 bg-stone-50 text-stone-700 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-circle-user"></i>
            </div>
            <h3 class="text-base font-medium text-stone-800 mb-2">擁有平台帳號嗎？</h3>
            <p class="text-xs text-stone-500 mb-6">登入或註冊帳號後，即可與大家一同評論、交流追星點滴喔！</p>
            <div class="flex flex-col gap-2">
                <button onclick="closeLoginModal(); switchPage('authPage'); toggleAuthTab('login')" class="w-full bg-stone-700 hover:bg-stone-800 text-white py-2 rounded-lg text-xs font-medium transition">
                    立即前往登入 / 註冊
                </button>
                <button onclick="closeLoginModal()" class="w-full text-stone-400 hover:text-stone-600 py-1.5 text-xs transition">
                    先隨便逛逛
                </button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-stone-100 py-6 text-center text-xs text-stone-400 border-t border-stone-200/50 mt-12">
        &copy; 2026 追星記事 - 簡約文青偶像交流平台
    </footer>

    <!-- 核心 JavaScript 邏輯 -->
    <script>
        // --- 資料初始化與模型定義 ---
        let users = JSON.parse(localStorage.getItem('idol_users')) || {
            "winter_fan": { id: "winter_fan", name: "冬日浪漫", password: "123", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" },
            "star_collector": { id: "star_collector", name: "微光極光", password: "123", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80" }
        };
        let posts = JSON.parse(localStorage.getItem('idol_posts')) || [
            // 預設一筆追星感貼文示範
            {
                id: "post_sample_1",
                userId: "winter_fan",
                userName: "冬日浪漫",
                userAvatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80",
                title: "這次的回歸舞台真的太驚艷了...",
                content: "今天看了打歌節目的直拍，主唱的音色、舞蹈的線條感都控制得太完美了，副歌的那個編舞看幾遍都不會膩。大家最喜歡這次專輯的哪一首收錄曲呢？",
                image: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=600&auto=format&fit=crop&q=80",
                likes: ["star_collector"],
                comments: [
                    { userName: "微光極光", content: "收錄曲推第三首！木吉他伴奏配上合音真的太溫柔了 T_T" }
                ],
                createdAt: "2026-05-18 10:15"
            }
        ];
        let currentUser = JSON.parse(localStorage.getItem('idol_current_user')) || null;
        let selectedPostImageBase64 = "";
        let tempLoginUser = null;

        // --- 圖片驗證資料 ---
        const captchaCategories = [
            {
                name: "麥克風",
                images: [
                    "https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1516280440502-a2f7c00e608d?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=150&h=150&fit=crop&q=80"
                ]
            },
            {
                name: "相機",
                images: [
                    "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1516961642265-531546e84af2?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1500634245200-e5245c7574ef?w=150&h=150&fit=crop&q=80"
                ]
            },
            {
                name: "吉他",
                images: [
                    "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1550291652-6ea9114a47b1?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1564186763535-ebb21ef5277f?w=150&h=150&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1525201548942-d8732f6617a0?w=150&h=150&fit=crop&q=80"
                ]
            }
        ];
        
        let captchaTarget = null;
        let captchaGridImages = [];
        let selectedCaptchaIndices = new Set();

        function generateCaptcha() {
            selectedCaptchaIndices.clear();
            const targetCategoryIndex = Math.floor(Math.random() * captchaCategories.length);
            captchaTarget = captchaCategories[targetCategoryIndex];
            document.getElementById('captchaTargetName').textContent = captchaTarget.name;
            
            const correctCount = Math.floor(Math.random() * 2) + 3; // 3 or 4 correct images
            const correctImages = [...captchaTarget.images].sort(() => 0.5 - Math.random()).slice(0, correctCount);
            
            let wrongImagesPool = [];
            captchaCategories.forEach((cat, idx) => {
                if (idx !== targetCategoryIndex) {
                    wrongImagesPool = wrongImagesPool.concat(cat.images);
                }
            });
            wrongImagesPool.sort(() => 0.5 - Math.random());
            const wrongImages = wrongImagesPool.slice(0, 9 - correctCount);
            
            let mixedImages = correctImages.map(url => ({ url, isCorrect: true }))
                              .concat(wrongImages.map(url => ({ url, isCorrect: false })));
            
            mixedImages.sort(() => 0.5 - Math.random());
            captchaGridImages = mixedImages;
            
            renderCaptchaGrid();
        }

        function renderCaptchaGrid() {
            const grid = document.getElementById('captchaGrid');
            grid.innerHTML = '';
            captchaGridImages.forEach((item, index) => {
                const isSelected = selectedCaptchaIndices.has(index);
                const imgDiv = document.createElement('div');
                imgDiv.className = `relative cursor-pointer w-full aspect-square transition-all duration-200 border-4 rounded-md overflow-hidden ` + 
                                   (isSelected ? 'border-sky-500 opacity-90 scale-[0.92]' : 'border-transparent hover:opacity-90');
                imgDiv.onclick = () => toggleCaptchaSelection(index);
                
                imgDiv.innerHTML = `
                    <img src="${item.url}" class="w-full h-full object-cover">
                    ${isSelected ? '<div class="absolute top-1.5 right-1.5 bg-sky-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm shadow-md"><i class="fa-solid fa-check"></i></div>' : ''}
                `;
                grid.appendChild(imgDiv);
            });
        }
        
        function toggleCaptchaSelection(index) {
            if (selectedCaptchaIndices.has(index)) {
                selectedCaptchaIndices.delete(index);
            } else {
                selectedCaptchaIndices.add(index);
            }
            renderCaptchaGrid();
        }

        let targetProfileUserId = null;

        // --- 頁面路由切換 ---
        function switchPage(pageId) {
            document.querySelectorAll('.page-view').forEach(view => view.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (pageId === 'squarePage') renderSquarePosts();
            if (pageId === 'profilePage') {
                if(!targetProfileUserId) targetProfileUserId = currentUser ? currentUser.id : null;
                renderProfilePage(targetProfileUserId);
            }
        }
        
        function viewUserProfile(userId) {
            targetProfileUserId = userId;
            switchPage('profilePage');
        }

        // --- 導覽列與認證狀態更新 ---
        function updateNavbar() {
            const navAuth = document.getElementById('navAuthButtons');
            if (currentUser) {
                navAuth.innerHTML = `
                    <button onclick="targetProfileUserId = null; switchPage('profilePage')" class="flex items-center gap-2 text-stone-600 hover:text-stone-900 transition">
                        <img src="${currentUser.avatar || 'https://via.placeholder.com/80'}" class="w-6 h-6 rounded-full object-cover border border-stone-200">
                        <span class="font-medium max-w-[80px] truncate">${currentUser.name}</span>
                    </button>
                    <span class="text-stone-300">|</span>
                    <button onclick="switchPage('squarePage')" class="text-stone-500 hover:text-stone-800 transition"><i class="fa-solid fa-compass"></i> 廣場</button>
                    <button onclick="handleLogout()" class="text-stone-400 hover:text-red-600 transition"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                `;
            } else {
                navAuth.innerHTML = `
                    <button onclick="switchPage('squarePage')" class="text-stone-500 hover:text-stone-800 transition mr-2"><i class="fa-solid fa-compass"></i> 廣場查看</button>
                    <button onclick="switchPage('authPage'); toggleAuthTab('login')" class="bg-stone-700/10 text-stone-800 px-3.5 py-1.5 rounded-full font-medium hover:bg-stone-700/20 transition">登入 / 註冊</button>
                `;
            }
        }

        // --- 註冊 / 登入頁面切換 ---
        function toggleAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const twoFactorForm = document.getElementById('twoFactorForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (twoFactorForm) twoFactorForm.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "text-stone-800 border-b-2 border-stone-800 pb-3 -mb-4 transition-all";
                tabRegister.className = "text-stone-400 pb-3 -mb-4 transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "text-stone-800 border-b-2 border-stone-800 pb-3 -mb-4 transition-all";
                tabLogin.className = "text-stone-400 pb-3 -mb-4 transition-all";
            }
        }

        // --- 圖片預覽功能 ---
        function previewImage(input, previewId, placeholderId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(previewId).src = e.target.result;
                    document.getElementById(previewId).classList.remove('hidden');
                    if(placeholderId) document.getElementById(placeholderId).classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // --- 使用者註冊 ---
        function handleRegister(event) {
            event.preventDefault();
            const id = document.getElementById('regId').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPassword').value;
            const avatarImg = document.getElementById('avatarPreview').src;

            if (users[id]) {
                alert('這個 ID 已經有人使用過了喔！');
                return;
            }

            // 預設質感頭貼
            const finalAvatar = avatarImg || `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80`;

            users[id] = { id, name, password, avatar: finalAvatar };
            localStorage.setItem('idol_users', JSON.stringify(users));
            
            alert('註冊成功！快來登入展開追星交流吧。');
            document.getElementById('registerForm').reset();
            document.getElementById('avatarPreview').classList.add('hidden');
            document.getElementById('avatarPlaceholder').classList.remove('hidden');
            toggleAuthTab('login');
        }

        // --- 使用者登入 ---
        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (users[id] && users[id].password === password) {
                tempLoginUser = users[id];
                
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('twoFactorForm').classList.remove('hidden');
                
                generateCaptcha();
            } else {
                alert('帳號或密碼輸入錯誤，請再試一次。');
            }
        }

        // --- 處理雙重認證 ---
        function handleTwoFactor(event) {
            event.preventDefault();
            
            let isAllCorrect = true;
            let correctCount = 0;
            captchaGridImages.forEach((item, index) => {
                const isSelected = selectedCaptchaIndices.has(index);
                if (item.isCorrect) correctCount++;
                if ((item.isCorrect && !isSelected) || (!item.isCorrect && isSelected)) {
                    isAllCorrect = false;
                }
            });
            
            if (isAllCorrect && correctCount > 0) {
                currentUser = tempLoginUser;
                localStorage.setItem('idol_current_user', JSON.stringify(currentUser));
                updateNavbar();
                alert(`歡迎回來，${currentUser.name}！安全驗證成功。`);
                document.getElementById('loginForm').reset();
                switchPage('profilePage');
                
                toggleAuthTab('login');
                tempLoginUser = null;
            } else {
                alert('驗證失敗，請再試一次！');
                generateCaptcha();
            }
        }
        
        // --- 取消雙重認證 ---
        function cancelTwoFactor() {
            tempLoginUser = null;
            toggleAuthTab('login');
        }

        // --- 使用者登出 ---
        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('idol_current_user');
            updateNavbar();
            switchPage('squarePage');
        }

        // --- 點擊發文權限判定 ---
        function checkLoginAndGoPost() {
            if (!currentUser) {
                openLoginModal();
            } else {
                document.getElementById('currentPostAvatar').src = currentUser.avatar;
                document.getElementById('currentPostName').textContent = currentUser.name;
                document.getElementById('currentPostId').textContent = `@${currentUser.id}`;
                
                document.getElementById('postTitle').value = "";
                document.getElementById('postContent').value = "";
                document.getElementById('postImageInput').value = "";
                document.getElementById('postImageName').textContent = "未選擇任何檔案";
                document.getElementById('postImgPreviewWrapper').classList.add('hidden');
                selectedPostImageBase64 = "";

                switchPage('createPostPage');
            }
        }

        // --- 發文圖片處理 ---
        function handlePostImageSelect(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('postImageName').textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedPostImageBase64 = e.target.result;
                    document.getElementById('postImagePreview').src = e.target.result;
                    document.getElementById('postImgPreviewWrapper').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // --- 創建發布新貼文 ---
        function handleCreatePost(event) {
            event.preventDefault();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            
            const now = new Date();
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newPost = {
                id: 'post_' + Date.now(),
                userId: currentUser.id,
                userName: currentUser.name,
                userAvatar: currentUser.avatar,
                title: title,
                content: content,
                image: selectedPostImageBase64 || null,
                likes: [],
                comments: [],
                createdAt: timeString
            };

            posts.unshift(newPost);
            localStorage.setItem('idol_posts', JSON.stringify(posts));

            alert('追星筆記發布成功！');
            switchPage('squarePage');
        }

        // --- 按讚切換邏輯 ---
        function toggleLike(postId) {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            const post = posts.find(p => p.id === postId);
            if (post) {
                const index = post.likes.indexOf(currentUser.id);
                if (index > -1) {
                    post.likes.splice(index, 1);
                } else {
                    post.likes.push(currentUser.id);
                }
                localStorage.setItem('idol_posts', JSON.stringify(posts));
                if(!document.getElementById('profilePage').classList.contains('hidden')) {
                    renderProfilePage();
                } else {
                    renderSquarePosts();
                }
            }
        }

        // --- 送出留言功能 ---
        function submitComment(postId) {
            if (!currentUser) {
                openLoginModal();
                return;
            }
            const input = document.getElementById(`commentInput-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const post = posts.find(p => p.id === postId);
            if (post) {
                post.comments.push({
                    userName: currentUser.name,
                    content: text
                });
                localStorage.setItem('idol_posts', JSON.stringify(posts));
                input.value = "";
                
                if(!document.getElementById('profilePage').classList.contains('hidden')) {
                    renderProfilePage();
                } else {
                    renderSquarePosts();
                }
            }
        }

        // --- 刪除貼文功能 ---
        function deletePost(postId) {
            if (!confirm('確定要刪除這篇貼文嗎？刪除後無法恢復。')) {
                return;
            }
            posts = posts.filter(p => p.id !== postId);
            localStorage.setItem('idol_posts', JSON.stringify(posts));
            
            if(!document.getElementById('profilePage').classList.contains('hidden')) {
                renderProfilePage();
            } else {
                renderSquarePosts();
            }
            alert('貼文已成功刪除！');
        }

        // --- 渲染貼文通用範本組件 ---
        function generatePostHTML(post) {
            const isLiked = currentUser ? post.likes.includes(currentUser.id) : false;
            const likeIconClass = isLiked ? 'fa-solid fa-heart text-rose-400' : 'fa-regular fa-heart';
            const imageBlock = post.image ? `<div class="mt-4 rounded-xl overflow-hidden max-h-96 border border-stone-100 bg-stone-50"><img src="${post.image}" class="w-full h-full object-cover"></div>` : '';
            
            let commentsHTML = '';
            post.comments.forEach(c => {
                commentsHTML += `
                    <div class="text-xs bg-stone-50/70 p-2.5 rounded-lg border border-stone-100/50">
                        <span class="font-medium text-stone-700">${c.userName}</span>：
                        <span class="text-stone-600">${c.content}</span>
                    </div>
                `;
            });

            return `
                <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200/60 shadow-xs transition hover:shadow-sm">
                    <!-- 1. 頭貼、ID 與刪除按鈕 -->
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition" onclick="viewUserProfile('${post.userId}')" title="查看主頁">
                            <img src="${post.userAvatar}" class="w-9 h-9 rounded-full object-cover border border-stone-100 shadow-inner">
                            <div>
                                <span class="text-sm font-medium text-stone-800 block">${post.userName}</span>
                                <span class="text-[10px] text-stone-400">@${post.userId} • ${post.createdAt}</span>
                            </div>
                        </div>
                        ${currentUser && currentUser.id === post.userId ? `
                        <button onclick="deletePost('${post.id}')" class="text-stone-400 hover:text-red-500 transition mt-1" title="刪除貼文">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                        ` : ''}
                    </div>
                    <!-- 2. 主題 -->
                    <h4 class="text-base font-medium text-stone-800 mb-2 tracking-wide"><span class="text-amber-600 font-normal">#</span> ${post.title}</h4>
                    <!-- 3. 下方為內容 -->
                    <p class="text-sm text-stone-600 leading-relaxed whitespace-pre-wrap">${post.content}</p>
                    
                    <!-- 4. 若有圖片在放在下面 -->
                    ${imageBlock}

                    <!-- 5. 按讚與評論區 icon -->
                    <div class="flex items-center gap-6 mt-5 pt-3 border-t border-stone-100 text-stone-400 text-xs font-medium">
                        <button onclick="toggleLike('${post.id}')" class="flex items-center gap-1.5 hover:text-rose-400 transition cursor-pointer">
                            <i class="${likeIconClass} text-sm"></i> <span>${post.likes.length}</span>
                        </button>
                        <div class="flex items-center gap-1.5">
                            <i class="fa-regular fa-comment text-sm"></i> <span>${post.comments.length} 個評論</span>
                        </div>
                    </div>

                    <!-- 評論交流區塊 -->
                    <div class="mt-4 pt-4 border-t border-dashed border-stone-100 space-y-2">
                        <div class="max-h-40 overflow-y-auto custom-scrollbar space-y-2 mb-3">
                            ${commentsHTML || '<p class="text-[11px] text-stone-400/80 tracking-wider text-center py-2">目前尚無評論，快來點評交流吧！</p>'}
                        </div>
                        <!-- 輸入評論框 -->
                        <div class="flex gap-2">
                            <input type="text" id="commentInput-${post.id}" 
                                   onclick="${!currentUser ? 'openLoginModal()' : ''}" 
                                   placeholder="${currentUser ? '寫下你的暖心評論...' : '登入後即可參與評論交流...'}" 
                                   class="flex-1 border border-stone-200 rounded-lg px-3 py-2 text-xs bg-stone-50/40 focus:outline-none focus:border-stone-600 transition">
                            <button onclick="submitComment('${post.id}')" class="bg-stone-700 hover:bg-stone-800 text-white text-xs px-3.5 py-2 rounded-lg transition shrink-0 font-medium">
                                傳送
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 渲染大廣場貼文區 ---
        function renderSquarePosts() {
            const listContainer = document.getElementById('squarePostList');
            if (posts.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-12 text-stone-400 text-sm">現在廣場空空的，快來當第一個發安利文的人吧！</div>`;
                return;
            }
            listContainer.innerHTML = posts.map(post => generatePostHTML(post)).join('');
        }

        // --- 渲染個人首頁與個人歷史發表紀錄 ---
        function renderProfilePage(userId) {
            const profileUser = users[userId];
            if (!profileUser) return;
            
            document.getElementById('profileUserAvatar').src = profileUser.avatar;
            document.getElementById('profileUserName').textContent = profileUser.name;
            document.getElementById('profileUserId').textContent = `@${profileUser.id}`;

            const createPostBtn = document.getElementById('createPostBtn');
            if (currentUser && currentUser.id === userId) {
                createPostBtn.classList.remove('hidden');
            } else {
                createPostBtn.classList.add('hidden');
            }

            const myPosts = posts.filter(p => p.userId === userId);
            const myPostContainer = document.getElementById('myPostList');

            if (myPosts.length === 0) {
                myPostContainer.innerHTML = `<div class="text-center py-12 text-stone-400 text-xs border border-dashed border-stone-200 rounded-2xl bg-white">目前還沒有發表過任何舞台筆記喔。</div>`;
                return;
            }
            myPostContainer.innerHTML = myPosts.map(post => generatePostHTML(post)).join('');
        }

        // --- 未登入提示視窗操作 ---
        function openLoginModal() {
            document.getElementById('loginPromptModal').classList.remove('hidden');
        }
        function closeLoginModal() {
            document.getElementById('loginPromptModal').classList.add('hidden');
        }

        // --- 程式初始運行啟動點 ---
        window.onload = function() {
            updateNavbar();
            switchPage('squarePage');
        };
    </script>
</body>
</html>
